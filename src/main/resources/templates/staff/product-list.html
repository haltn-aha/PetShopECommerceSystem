
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Quản Lý Sản Phẩm</title>
</head>
<body>
<div layout:fragment="admin-content">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">Quản Lý Sản Phẩm</h4>
        <a th:href="@{/staff/products/create}"
           class="btn btn-pet-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm Sản Phẩm
        </a>
    </div>

    <!-- Search and filter -->
    <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
        <form th:action="@{/staff/products}" method="get"
              class="row g-3 align-items-end">

            <div class="col-md-5">
                <label for="keyword" class="form-label">
                    Tên sản phẩm
                </label>
                <input type="text"
                       id="keyword"
                       name="keyword"
                       class="form-control"
                       placeholder="Nhập tên sản phẩm..."
                       th:value="${keyword}">
            </div>

            <div class="col-md-4">
                <label for="categoryId" class="form-label">
                    Danh mục
                </label>
                <select id="categoryId"
                        name="categoryId"
                        class="form-select">
                    <option value="">Tất cả danh mục</option>
                    <option th:each="c : ${categories}"
                            th:value="${c.id}"
                            th:text="${c.name}"
                            th:selected="${selectedCategoryId != null and selectedCategoryId == c.id}">
                    </option>
                </select>
            </div>

            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search me-1"></i>Lọc
                </button>
                <a th:href="@{/staff/products}"
                   class="btn btn-outline-secondary">
                    Xóa lọc
                </a>
            </div>

            <input type="hidden" name="size"
                   th:value="${products.size}">
        </form>
    </div>

    <!-- Product table -->
    <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted">
                Tổng số:
                <strong th:text="${products.totalElements}">0</strong>
                sản phẩm
            </span>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th>Thú cưng</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="p : ${products.content}">
                    <td th:text="${p.id}">1</td>
                    <td class="fw-semibold" th:text="${p.name}">
                        Tên sản phẩm
                    </td>
                    <td th:text="${p.category != null ? p.category.name : '-'}">
                        Danh mục
                    </td>
                    <td>
                        <span class="badge bg-secondary"
                              th:text="${p.petType}">DOG</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${p.status.name() == 'ACTIVE'} ? ' bg-success' : ' bg-secondary'"
                              th:text="${p.status}">
                            ACTIVE
                        </span>
                    </td>
                    <td class="text-nowrap">
                        <a th:href="@{/staff/products/{id}/edit(id=${p.id})}"
                           class="btn btn-sm btn-outline-secondary">
                            Sửa
                        </a>
                        <a th:href="@{/staff/products/{id}/variants(id=${p.id})}"
                           class="btn btn-sm btn-outline-primary ms-1">
                            SKU
                        </a>
                    </td>
                </tr>

                <tr th:if="${products.empty}">
                    <td colspan="6" class="text-center text-muted py-4">
                        Không tìm thấy sản phẩm phù hợp.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${products.totalPages > 1}"
             class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-3">

            <span class="text-muted small">
                Trang <span th:text="${products.number + 1}">1</span>
                / <span th:text="${products.totalPages}">1</span>
            </span>

            <nav aria-label="Phân trang sản phẩm">
                <ul class="pagination pagination-sm mb-0">

                    <li class="page-item"
                        th:classappend="${products.first} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/staff/products(page=${products.number - 1},size=${products.size},keyword=${keyword},categoryId=${selectedCategoryId})}">
                            Trước
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? ' active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/staff/products(page=${i},size=${products.size},keyword=${keyword},categoryId=${selectedCategoryId})}">
                            1
                        </a>
                    </li>

                    <li class="page-item"
                        th:classappend="${products.last} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/staff/products(page=${products.number + 1},size=${products.size},keyword=${keyword},categoryId=${selectedCategoryId})}">
                            Sau
                        </a>
                    </li>

                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
