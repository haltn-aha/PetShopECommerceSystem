
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <title>Thêm sản phẩm - PetShop</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-success mb-1">
                    <i class="bi bi-box-seam me-2"></i>
                    <span th:text="${product.id == null ? 'Thêm sản phẩm mới' : 'Chỉnh sửa sản phẩm'}">
                        Thêm sản phẩm mới
                    </span>
                </h3>
                <p class="text-white mb-0">Nhập thông tin sản phẩm PetShop</p>
            </div>

            <a th:href="@{/staff/products}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Quay lại
            </a>
        </div>

        <div th:if="${errorMessage != null}"
             class="alert alert-danger"
             th:text="${errorMessage}"></div>

        <form th:action="${product.id == null}
                  ? @{/staff/products/create}
                  : @{/staff/products/{id}/edit(id=${product.id})}"
              th:object="${product}"
              method="post">

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">1. Thông tin cơ bản</h5>
                </div>

                <div class="card-body">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Tên sản phẩm *</label>
                            <input type="text" th:field="*{name}"
                                   class="form-control"
                                   placeholder="Ví dụ: Thức ăn cho mèo"
                                   required maxlength="255">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Danh mục *</label>
                            <select th:field="*{category.id}"
                                    class="form-select" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}">
                                    Danh mục
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Thương hiệu</label>
                            <select th:field="*{brand.id}" class="form-select">
                                <option value="">-- Chọn thương hiệu --</option>
                                <option th:each="brand : ${brands}"
                                        th:value="${brand.id}"
                                        th:text="${brand.name}">
                                    Thương hiệu
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Loại thú cưng</label>
                            <select th:field="*{petType}" class="form-select">
                                <option value="BOTH">Chó và mèo</option>
                                <option value="DOG">Chó</option>
                                <option value="CAT">Mèo</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Mô tả ngắn</label>
                            <textarea th:field="*{shortDescription}"
                                      class="form-control" rows="2"
                                      placeholder="Giới thiệu ngắn về sản phẩm"></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Mô tả chi tiết</label>
                            <textarea th:field="*{description}"
                                      class="form-control" rows="4"
                                      placeholder="Thông tin chi tiết về sản phẩm"></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Hướng dẫn sử dụng</label>
                            <textarea th:field="*{usageInstructions}"
                                      class="form-control" rows="3"
                                      placeholder="Hướng dẫn sử dụng sản phẩm"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Trạng thái</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="ACTIVE">Đang hoạt động</option>
                                <option value="HIDDEN">Ẩn sản phẩm</option>
                            </select>
                        </div>

                        <div class="col-md-6 d-flex align-items-center">
                            <div class="form-check mt-4">
                                <input type="checkbox" th:field="*{featured}"
                                       class="form-check-input" id="featured">
                                <label class="form-check-label" for="featured">
                                    Sản phẩm nổi bật
                                </label>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-success text-white d-flex
                            justify-content-between align-items-center">
                    <h5 class="mb-0">2. Biến thể sản phẩm</h5>
                    <button type="button" class="btn btn-light btn-sm"
                            onclick="addVariant()">
                        <i class="bi bi-plus-circle me-1"></i>
                        Thêm biến thể
                    </button>
                </div>

                <div class="card-body">
                    <p class="text-muted small">
                        Ví dụ: size S/M/L, trọng lượng 500g/1kg hoặc các loại sản phẩm.
                    </p>

                    <div id="variant-container"></div>

                    <div id="no-variant" class="text-center text-muted py-3">
                        Chưa có biến thể. Bấm "Thêm biến thể" để nhập.
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mb-5">
                <button type="reset" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>
                    Làm mới
                </button>

                <a th:href="@{/staff/products}"
                   class="btn btn-outline-danger">Hủy</a>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save me-1"></i>
                    Lưu sản phẩm
                </button>
            </div>
        </form>
    </div>

    <script>
        let variantIndex = 0;

        function addVariant() {
            const container = document.getElementById('variant-container');
            const emptyMessage = document.getElementById('no-variant');
            emptyMessage.style.display = 'none';

            const index = variantIndex++;

            const card = document.createElement('div');
            card.className = 'border rounded p-3 mb-3 variant-item';

            card.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="fw-bold mb-0">Biến thể ${index + 1}</h6>
                    <button type="button" class="btn btn-outline-danger btn-sm"
                            onclick="this.closest('.variant-item').remove(); updateVariantMessage();">
                        <i class="bi bi-trash me-1"></i> Xóa biến thể
                    </button>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tên biến thể *</label>
                        <input name="variantNames" class="form-control"
                               placeholder="Ví dụ: Túi 1kg" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mã SKU *</label>
                        <input name="variantSkus" class="form-control"
                               placeholder="Ví dụ: CAT-FOOD-1KG" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Giá bán *</label>
                        <input name="variantPrices" type="number" min="0"
                               step="0.01" class="form-control"
                               placeholder="Ví dụ: 150000" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Giá gốc</label>
                        <input name="variantOriginalPrices" type="number"
                               min="0" step="0.01" class="form-control"
                               placeholder="Ví dụ: 180000">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Số lượng tồn kho *</label>
                        <input name="variantStocks" type="number" min="0"
                               value="0" class="form-control" required>
                    </div>
                </div>
            `;

            container.appendChild(card);
            updateVariantMessage();
        }

        function updateVariantMessage() {
            const container = document.getElementById('variant-container');
            const emptyMessage = document.getElementById('no-variant');
            emptyMessage.style.display =
                container.querySelector('.variant-item') ? 'none' : 'block';
        }
    </script>
</div>
</body>
</html>
