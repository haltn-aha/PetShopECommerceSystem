<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Đặt Lại Mật Khẩu</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <div class="text-center mb-4">
                        <span style="font-size:3rem;line-height:1;">&#128062;</span>
                        <h4 class="fw-bold mt-2">Đặt Lại Mật Khẩu Mới</h4>
                        <p class="text-muted small">Vui lòng thiết lập mật khẩu mới cho tài khoản của bạn</p>
                    </div>

                    <!-- Thông báo lỗi nếu có -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-1"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/reset-password}" method="post">
                        <input type="hidden" name="token" th:value="${token}">

                        <div class="mb-3">
                            <label for="newPassword" class="form-label small fw-semibold">Mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="6" placeholder="Tối thiểu 6 ký tự">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label small fw-semibold">Xác nhận mật khẩu mới</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="Nhập lại mật khẩu mới">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-pet-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-check2-circle me-1"></i> Lưu Mật Khẩu Mới
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/login}" class="small text-decoration-none fw-semibold">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại Đăng Nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
