<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/password-reset-layout}">
<head>
    <title>Thiết Lập Mật Khẩu</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h4 class="fw-bold text-center mb-3">Thiết Lập Mật Khẩu</h4>
                    <div th:if="${errorMessage}" class="alert alert-danger small" role="alert" th:text="${errorMessage}"></div>
                    <p th:if="${resetLinkValid}" class="text-muted small">Đặt mật khẩu cho tài khoản nhận liên kết qua email. Liên kết chỉ dùng một lần. Sau khi lưu, hãy đăng nhập bằng email và mật khẩu vừa đặt.</p>
                    <form th:if="${resetLinkValid}" th:action="@{/reset-password}" method="post">
                        <input type="hidden" name="token" th:value="${token}">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Mật khẩu mới</label>
                            <input type="password" name="newPassword" autocomplete="new-password" class="form-control" required minlength="6" placeholder="Tối thiểu 6 ký tự">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Xác nhận mật khẩu mới</label>
                            <input type="password" name="confirmPassword" autocomplete="new-password" class="form-control" required minlength="6" placeholder="Nhập lại mật khẩu mới">
                        </div>
                        <button type="submit" class="btn btn-pet-primary w-100 py-2">Lưu Mật Khẩu</button>
                    </form>
                    <a th:unless="${resetLinkValid}" th:href="@{/forgot-password}" class="btn btn-pet-primary w-100">Yêu cầu liên kết mới</a>
                    <a th:href="@{/login}" class="d-block text-center small mt-3">Về trang đăng nhập</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
