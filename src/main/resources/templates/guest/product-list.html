<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Danh Sách Sản Phẩm</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <h2 class="fw-bold mb-4">Sản Phẩm Của Chúng Tôi</h2>
        <div class="row g-4" th:if="${products != null and !products.empty}">
            <div class="col-12 col-sm-6 col-lg-3" th:each="product : ${products.content}">
                <div class="card h-100 border shadow-sm rounded-3 overflow-hidden">
                    <img th:src="${product.primaryImageUrl != null ? product.primaryImageUrl : 'https://placehold.co/400x300?text=PetShop'}" class="card-img-top" alt="Product" style="height: 200px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="badge bg-secondary" th:text="${product.petType}">DOG</span>
                            <small class="text-warning"><i class="bi bi-star-fill"></i> <span th:text="${product.reviewCount > 0 ? product.avgRating : 'Chưa có đánh giá'}"></span></small>
                        </div>
                        <h6 class="card-title fw-bold text-truncate" th:text="${product.name}">Tên sản phẩm</h6>
                        <p class="text-danger fw-bold fs-5 mb-3" th:text="${#numbers.formatDecimal(product.minPrice != null ? product.minPrice : 0, 0, 'POINT', 0, 'COMMA') + ' đ'}">150.000 đ</p>
                        <a th:href="@{/products/{slug}(slug=${product.slug})}" class="btn btn-outline-primary mt-auto w-100">Chi Tiết</a>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${products == null or products.empty}" class="alert alert-info mt-4">
            Không tìm thấy sản phẩm nào phù hợp với bộ lọc.
        </div>
    </div>
</div>
</body>
</html>
