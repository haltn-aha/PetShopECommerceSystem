<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Quên Mật Khẩu</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <div class="text-center mb-4">
                        <span style="font-size:3rem;line-height:1;">&#128062;</span>
                        <h4 class="fw-bold mt-2">Quên Mật Khẩu</h4>
                        <p class="text-muted small">Nhập địa chỉ email đăng ký để nhận liên kết đặt lại mật khẩu</p>
                    </div>

                    <!-- Thông báo thành công / hướng dẫn gửi email -->
                    <div th:if="${infoMessage}" class="alert alert-info py-2 small" role="alert">
                        <i class="bi bi-info-circle-fill me-1"></i>
                        <span th:text="${infoMessage}"></span>
                    </div>

                    <!-- Thông báo lỗi nếu có -->
                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-1"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Địa chỉ Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required autofocus placeholder="customer@petshop.vn">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-pet-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-send-fill me-1"></i> Gửi Liên Kết Khôi Phục
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/login}" class="small text-decoration-none fw-semibold">
                            <i class="bi bi-arrow-left me-1"></i> Quay lại Đăng Nhập
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
