<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Quên Mật Khẩu</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h4 class="fw-bold text-center mb-3">Quên Mật Khẩu</h4>
                    <p class="text-muted small text-center mb-4">Nhập địa chỉ email của bạn để nhận liên kết khôi phục mật khẩu.</p>
                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Địa chỉ Email</label>
                            <input type="email" name="email" class="form-control" required placeholder="customer@petshop.vn">
                        </div>
                        <button type="submit" class="btn btn-pet-primary w-100 py-2">Gửi Yêu Cầu</button>
                    </form>
                    <div class="text-center mt-3">
                        <a th:href="@{/login}" class="small text-decoration-none">Quay lại đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
