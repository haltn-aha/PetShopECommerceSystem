<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title layout:title-pattern="$CONTENT_TITLE - PetShop">Đặt mật khẩu - PetShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: #f7f9fc; color: #243746; }
        .auth-header { padding: 20px 24px; text-align: center; background: white; border-bottom: 1px solid #e5eaf0; }
        .auth-brand { color: #0d9488; font-size: 25px; font-weight: 700; text-decoration: none; }
        main { flex: 1; }
        .btn-pet-primary { color: white; background: #0d9488; border-color: #0d9488; }
        .btn-pet-primary:hover { color: white; background: #0f766e; border-color: #0f766e; }
        a { color: #0f766e; }
        .auth-footer { padding: 20px; text-align: center; color: #64748b; font-size: 13px; }
    </style>
</head>
<body>
<header class="auth-header"><a th:href="@{/}" class="auth-brand">PetShop</a></header>
<main layout:fragment="content"></main>
<footer class="auth-footer">PetShop · Thiết lập mật khẩu qua liên kết email</footer>
</body>
</html>
