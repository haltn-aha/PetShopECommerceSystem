<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Chỉnh Sửa Tài Khoản</title>
</head>
<body>
<div layout:fragment="admin-header-title">
    <span>Quản Trị Hệ Thống / Chỉnh Sửa Tài Khoản</span>
</div>

<div layout:fragment="admin-content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h4 class="fw-bold mb-1">Chỉnh Sửa Tài Khoản</h4>
                    <p class="text-muted small mb-0">Cập nhật thông tin và trạng thái hoạt động của người dùng.</p>
                </div>
                <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <form th:action="@{/admin/users/{id}/edit(id=${userForm.id})}" th:object="${userForm}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và Tên <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{fullName}" class="form-control form-control-lg"
                               placeholder="VD: Nguyễn Văn A" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Địa chỉ Email</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   placeholder="user@example.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Số Điện Thoại</label>
                            <input type="text" th:field="*{phone}" class="form-control"
                                   placeholder="0912345678" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Vai trò hệ thống</label>
                            <input class="form-control" th:value="${targetUser.role.code}" readonly aria-label="Vai trò cố định">
                            <div class="form-text">Vai trò được xác định khi tạo tài khoản và không chuyển đổi tại màn hình này.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Trạng Thái Tài Khoản <span class="text-danger">*</span></label>
                            <select th:field="*{status}" class="form-select" th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                                <option value="ACTIVE">ACTIVE (Đang hoạt động)</option>
                                <option value="LOCKED">LOCKED (Tạm khóa)</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{status}"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/admin/users}" class="btn btn-light px-4">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-save me-1"></i> Lưu Thay Đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
