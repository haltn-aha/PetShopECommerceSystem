<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <title>Quản Lý Sản Phẩm</title>
</head>

<body>
<div layout:fragment="content" class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Quản Lý Sản Phẩm</h3>
            <p class="text-muted mb-0">Thêm, sửa và quản lý trạng thái sản phẩm.</p>
        </div>

        <a th:href="@{/admin/products/create}"
           class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Thêm sản phẩm
        </a>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}"></div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form method="get"
                  th:action="@{/admin/products}"
                  class="row g-3">

                <div class="col-md-6">
                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="Tìm theo tên sản phẩm..."
                           th:value="${keyword}">
                </div>

                <div class="col-md-4">
                    <select name="categoryId" class="form-select">
                        <option value="">Tất cả danh mục</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}"
                                th:selected="${selectedCategoryId != null and selectedCategoryId == category.id}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Tìm
                    </button>
                    <a th:href="@{/admin/products}"
                       class="btn btn-outline-secondary">Xóa lọc</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Danh mục</th>
                    <th>Thương hiệu</th>
                    <th>Loại thú cưng</th>
                    <th>Trạng thái</th>
                    <th style="min-width: 230px;">Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="product : ${products.content}">
                    <td th:text="${product.id}"></td>

                    <td>
                        <div class="fw-semibold" th:text="${product.name}"></div>
                        <small class="text-muted"
                               th:text="${product.slug}"></small>
                    </td>

                    <td th:text="${product.category != null ? product.category.name : '—'}"></td>

                    <td th:text="${product.brand != null ? product.brand.name : '—'}"></td>

                    <td th:text="${product.petType}"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${product.status.name() == 'ACTIVE'} ? 'bg-success' :
                                              (${product.status.name() == 'HIDDEN'} ? 'bg-secondary' : 'bg-warning text-dark')"
                              th:text="${product.status}">
                        </span>
                    </td>

                    <td>
                        <div class="d-flex flex-wrap gap-2">
                            <a th:href="@{/admin/products/{id}/edit(id=${product.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i> Sửa
                            </a>

                            <!-- Nếu Admin dùng chung trang variant của staff hoặc bạn muốn đổi sang admin tùy ý -->
                            <a th:href="@{/staff/products/{id}/variants(id=${product.id})}"
                               class="btn btn-sm btn-outline-info">
                                <i class="bi bi-box-seam"></i> SKU
                            </a>

                            <form th:if="${product.status.name() == 'ACTIVE'}"
                                  th:action="@{/admin/products/{id}/status(id=${product.id})}"
                                  method="post"
                                  onsubmit="return confirm('Em có chắc muốn ẩn sản phẩm này không?')">

                                <input type="hidden" name="status" value="HIDDEN">

                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-eye-slash"></i> Ẩn
                                </button>
                            </form>

                            <form th:if="${product.status.name() == 'HIDDEN'}"
                                  th:action="@{/admin/products/{id}/status(id=${product.id})}"
                                  method="post">

                                <input type="hidden" name="status" value="ACTIVE">

                                <button type="submit" class="btn btn-sm btn-outline-success">
                                    <i class="bi bi-eye"></i> Hiện
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${products == null or products.empty}">
                    <td colspan="7" class="text-center text-muted py-4">
                        Không tìm thấy sản phẩm nào.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-body"
             th:if="${products != null and products.totalPages > 1}">
            <nav>
                <ul class="pagination justify-content-center mb-0">

                    <li class="page-item"
                        th:classappend="${products.first} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/products(page=${products.number - 1},size=${products.size},keyword=${keyword},categoryId=${selectedCategoryId})}">
                            Trước
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? 'active'">
                        <a class="page-link"
                           th:href="@{/admin/products(page=${i},size=${products.size},keyword=${keyword},categoryId=${selectedCategoryId})}"
                           th:text="${i + 1}"></a>
                    </li>

                    <li class="page-item"
                        th:classappend="${products.last} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/products(page=${products.number + 1},size=${products.size},keyword=${keyword},categoryId=${selectedCategoryId})}">
                            Sau
                        </a>
                    </li>

                </ul>
            </nav>
        </div>
    </div>

</div>
</body>
</html>
