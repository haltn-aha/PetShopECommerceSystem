<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Danh Mục & Thương Hiệu - PetShop</title>
</head>
<body>
<div layout:fragment="content" class="py-5 bg-light-subtle min-vh-100">
    <div class="container">

        <div class="text-center mb-5">
            <h2 class="fw-bold text-dark">Khám Phá Danh Mục & Thương Hiệu</h2>
            <p class="text-muted">Lựa chọn các sản phẩm chính hãng từ những thương hiệu hàng đầu cho thú cưng</p>
        </div>

        <!-- 1. PHẦN HIỂN THỊ DANH MỤC -->
        <div class="mb-5">
            <h4 class="fw-bold mb-4 text-success border-bottom pb-2">
                <i class="bi bi-grid-fill me-2"></i>Danh Mục Sản Phẩm
            </h4>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
                <!-- Lặp qua danh sách Category từ Controller (ví dụ: categories) -->
                <div class="col" th:each="cat : ${categories}">
                    <div class="card border-0 shadow-sm rounded-4 h-100 text-center p-3 hover-shadow transition">
                        <div class="card-body">
                            <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                                <i class="bi bi-tag-fill fs-3"></i>
                            </div>
                            <h5 class="fw-bold text-dark mb-2" th:text="${cat.name}">Thức ăn cho chó</h5>
                            <p class="text-muted small mb-3" th:text="${cat.description}">Sản phẩm dinh dưỡng cao cấp</p>
                            <a th:href="@{/products(categoryId=${cat.id})}" class="btn btn-outline-success btn-sm rounded-pill px-4">
                                Xem sản phẩm
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. PHẦN HIỂN THỊ THƯƠNG HIỆU (BRANDS) -->
        <div class="mt-5">
            <h4 class="fw-bold mb-4 text-success border-bottom pb-2">
                <i class="bi bi-award-fill me-2"></i>Thương Hiệu Nổi Bật
            </h4>
            <div class="row row-cols-2 row-cols-sm-3 row-cols-lg-6 g-4">

                <div class="col" th:each="brand : ${brands}">
                    <div class="card border-0 shadow-sm rounded-4 h-100 text-center p-3">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <img th:src="${brand.logoUrl != null ? brand.logoUrl : 'https://placehold.co/100x60?text=Brand'}"
                                 class="img-fluid mb-3 object-fit-contain" style="height: 50px;" alt="Brand Logo">
                            <h6 class="fw-bold text-dark mb-1" th:text="${brand.name}">Royal Canin</h6>
                            <a th:href="@{/products(brandId=${brand.id})}" class="stretched-link"></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
