
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <title>Quản lý danh mục - PetShop</title>
</head>

<body>
<div layout:fragment="content" class="py-5 bg-light-subtle min-vh-100">
    <div class="container">

        <!-- Page header -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h2 class="fw-bold text-dark mb-2">Quản lý danh mục</h2>
                <p class="text-muted mb-0">
                    Thêm, xem, chỉnh sửa và quản lý trạng thái danh mục sản phẩm.
                </p>
            </div>

            <a th:href="@{/admin/categories/create}"
               class="btn btn-success rounded-pill px-4">
                <i class="bi bi-plus-circle me-2"></i>Thêm danh mục
            </a>
        </div>

        <!-- Success message -->
        <div th:if="${successMessage}"
             class="alert alert-success alert-dismissible fade show"
             role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close"
                    data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Error message -->
        <div th:if="${errorMessage}"
             class="alert alert-danger alert-dismissible fade show"
             role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close"
                    data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Category table -->
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-header bg-white border-0 pt-4 px-4">
                <h5 class="fw-bold mb-0">
                    <i class="bi bi-grid-fill text-success me-2"></i>
                    Danh sách danh mục
                </h5>
            </div>

            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Mã danh mục</th>
                            <th>Tên danh mục</th>
                            <th>Mô tả</th>
                            <th>Thứ tự</th>
                            <th>Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="cat : ${categories}">
                            <td th:text="${cat.id}"></td>

                            <td>
                                <span class="badge bg-light text-dark border"
                                      th:text="${cat.code}"></span>
                            </td>

                            <td class="fw-semibold"
                                th:text="${cat.name}"></td>

                            <td>
                                <span th:text="${cat.description != null
                                    and !cat.description.isEmpty()
                                    ? cat.description : '-'}"></span>
                            </td>

                            <td th:text="${cat.sortOrder}"></td>

                            <td>
                                <span th:if="${cat.isActive}"
                                      class="badge rounded-pill bg-success-subtle text-success">
                                    Đang hoạt động
                                </span>

                                <span th:unless="${cat.isActive}"
                                      class="badge rounded-pill bg-secondary-subtle text-secondary">
                                    Ngừng hoạt động
                                </span>
                            </td>

                            <td>
                                <div class="d-flex justify-content-center gap-2 flex-wrap">

                                    <!-- Edit -->
                                    <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}"
                                       class="btn btn-sm btn-outline-primary"
                                       title="Chỉnh sửa">
                                        <i class="bi bi-pencil-square"></i>
                                        Sửa
                                    </a>

                                    <!-- Activate / deactivate -->
                                    <form th:action="@{/admin/categories/toggle-status/{id}(id=${cat.id})}"
                                          method="post"
                                          class="d-inline">

                                        <button type="submit"
                                                class="btn btn-sm"
                                                th:classappend="${cat.isActive}
                                                    ? ' btn-outline-danger'
                                                    : ' btn-outline-success'"
                                                th:title="${cat.isActive}
                                                    ? 'Ngừng hoạt động'
                                                    : 'Kích hoạt lại'"
                                                onclick="return confirm('Em có chắc muốn thay đổi trạng thái danh mục này không?')">

                                            <i th:class="${cat.isActive}
                                                ? 'bi bi-pause-circle'
                                                : 'bi bi-check-circle'"></i>

                                            <span th:text="${cat.isActive}
                                                ? 'Ngừng hoạt động'
                                                : 'Kích hoạt'"></span>
                                        </button>
                                    </form>

                                </div>
                            </td>
                        </tr>

                        <!-- Empty state -->
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="7" class="text-center py-5">
                                <i class="bi bi-inbox display-5 text-muted"></i>
                                <p class="text-muted mt-3 mb-2">
                                    Chưa có danh mục nào.
                                </p>
                                <a th:href="@{/admin/categories/create}"
                                   class="btn btn-success btn-sm rounded-pill px-3">
                                    Thêm danh mục đầu tiên
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
