
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">

<head>
    <title>Quản lý thương hiệu</title>
</head>

<body>
<div layout:fragment="content" class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="text-white">Quản lý thương hiệu</h2>
            <p class="text-white-50 mb-0">
                Thêm, sửa, xóa và quản lý trạng thái thương hiệu.
            </p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-light">
            <i class="bi bi-arrow-left"></i> Trang quản trị
        </a>
    </div>

    <!-- Create brand -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-success text-white">
            <i class="bi bi-plus-circle me-2"></i>Thêm thương hiệu
        </div>

        <div class="card-body">
            <form th:action="@{/admin/brands/create}"
                  th:object="${brand}" method="post">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">
                            Tên thương hiệu *
                        </label>
                        <input type="text" class="form-control"
                               th:field="*{name}" maxlength="150"
                               placeholder="Ví dụ: Royal Canin" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">
                            Đường dẫn logo
                        </label>
                        <input type="text" class="form-control"
                               th:field="*{logoUrl}" maxlength="1000"
                               placeholder="/images/brands/logo.png">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Mô tả</label>
                        <input type="text" class="form-control"
                               th:field="*{description}" maxlength="1000"
                               placeholder="Thông tin thương hiệu">
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-plus-lg me-1"></i>Thêm thương hiệu
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Brand list -->
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <strong>Danh sách thương hiệu</strong>
            <span class="badge bg-secondary ms-2"
                  th:text="${#lists.size(brands)}">0</span>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Logo</th>
                        <th>Tên thương hiệu</th>
                        <th>Mô tả</th>
                        <th>Trạng thái</th>
                        <th style="min-width: 280px">Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="brand : ${brands}">
                        <td th:text="${brand.id}">1</td>

                        <td>
                            <img th:if="${brand.logoUrl != null
                                         and !brand.logoUrl.isBlank()}"
                                 th:src="${brand.logoUrl}"
                                 alt="Logo"
                                 style="width:50px;height:50px;object-fit:contain">

                            <span th:if="${brand.logoUrl == null
                                          or brand.logoUrl.isBlank()}"
                                  class="text-muted">Chưa có logo</span>
                        </td>

                        <td class="fw-semibold" th:text="${brand.name}">
                            Royal Canin
                        </td>

                        <td th:text="${brand.description != null
                                      and !brand.description.isBlank()
                                      ? brand.description : 'Chưa có mô tả'}">
                            Mô tả
                        </td>

                        <td>
                            <span th:if="${brand.isActive}"
                                  class="badge bg-success">Đang hoạt động</span>
                            <span th:unless="${brand.isActive}"
                                  class="badge bg-secondary">Ngừng hoạt động</span>
                        </td>

                        <td>
                            <div class="d-flex flex-wrap gap-2">

                                <button type="button"
                                        class="btn btn-sm btn-primary"
                                        data-bs-toggle="modal"
                                        th:attr="data-bs-target='#editBrand' + ${brand.id}">
                                    <i class="bi bi-pencil-square"></i> Sửa
                                </button>

                                <form th:action="@{/admin/brands/toggle-status/{id}(id=${brand.id})}"
                                      method="post">
                                    <button type="submit"
                                            class="btn btn-sm"
                                            th:classappend="${brand.isActive}
                                                ? ' btn-warning' : ' btn-success'"
                                            th:text="${brand.isActive}
                                                ? 'Ngừng hoạt động' : 'Kích hoạt'">
                                        Trạng thái
                                    </button>
                                </form>

                                <form th:action="@{/admin/brands/delete/{id}(id=${brand.id})}"
                                      method="post"
                                      onsubmit="return confirm('Em có chắc muốn xóa thương hiệu này?');">
                                    <button type="submit"
                                            class="btn btn-sm btn-danger">
                                        <i class="bi bi-trash"></i> Xóa
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(brands)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            Chưa có thương hiệu nào.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit modals -->
    <div th:each="brand : ${brands}">
        <div class="modal fade"
             th:id="'editBrand' + ${brand.id}"
             tabindex="-1" aria-hidden="true">

            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">

                    <form th:action="@{/admin/brands/update/{id}(id=${brand.id})}"
                          method="post">

                        <div class="modal-header">
                            <h5 class="modal-title">Sửa thương hiệu</h5>
                            <button type="button" class="btn-close"
                                    data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Tên thương hiệu *</label>
                                <input type="text" name="name"
                                       class="form-control"
                                       th:value="${brand.name}"
                                       maxlength="150" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Đường dẫn logo</label>
                                <input type="text" name="logoUrl"
                                       class="form-control"
                                       th:value="${brand.logoUrl}"
                                       maxlength="1000">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mô tả</label>
                                <textarea name="description"
                                          class="form-control" rows="3"
                                          maxlength="1000"
                                          th:text="${brand.description}"></textarea>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary"
                                    data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Lưu thay đổi
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
