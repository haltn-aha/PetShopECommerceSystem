<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin-layout}">
<head><title>Báo cáo đánh giá theo sản phẩm</title></head><body>
<div layout:fragment="admin-header-title">Báo cáo đánh giá theo sản phẩm</div>
<main layout:fragment="admin-content"><h1 class="h4 mb-3">Báo cáo đánh giá theo sản phẩm</h1><p>Thống kê đánh giá theo ngày tạo và sản phẩm. Điểm bình quân gồm cả đánh giá đang ẩn; số công khai và ẩn được tách riêng.</p><form method="get" class="row g-3 mb-4"><div class="col-md-3"><label>Từ ngày</label><input class="form-control" type="date" name="startDate" th:value="${startDate}" required></div><div class="col-md-3"><label>Đến ngày</label><input class="form-control" type="date" name="endDate" th:value="${endDate}" required></div><div class="col-md-2 align-self-end"><button class="btn btn-primary">Xem báo cáo</button></div></form><table class="table table-striped"><thead><tr><th>Sản phẩm</th><th>Số đánh giá</th><th>Điểm bình quân</th><th>Công khai</th><th>Ẩn</th></tr></thead><tbody><tr th:each="row : ${reviewStats}"><td th:text="${row[0]}"></td><td th:text="${row[1]}"></td><td th:text="${#numbers.formatDecimal(row[2],1,'POINT',1,'COMMA')}"></td><td th:text="${row[3]}"></td><td th:text="${row[4]}"></td></tr><tr th:if="${#lists.isEmpty(reviewStats)}"><td colspan="5">Chưa có đánh giá trong kỳ này.</td></tr></tbody></table><a th:href="@{/admin/reviews}" class="btn btn-outline-primary">Quản lý và ẩn/hiện đánh giá</a></main></body></html>
