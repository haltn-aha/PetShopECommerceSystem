<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title th:text="${category.id == null ? 'Thêm danh mục' : 'Chỉnh sửa danh mục'} + ' - PetShop'">Danh mục - PetShop</title>
</head>
<body>
<div layout:fragment="content" class="py-5 bg-light-subtle min-vh-100">
    <div class="container">

        <div class="mb-4">
            <h2 class="fw-bold text-dark"
                th:text="${category.id == null ? 'Thêm danh mục' : 'Chỉnh sửa danh mục'}">
                Thêm danh mục
            </h2>
            <p class="text-muted">Nhập thông tin danh mục sản phẩm.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger"
             th:text="${errorMessage}"></div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <form th:object="${category}"
                      th:action="${category.id == null
                          ? '/admin/categories/create'
                          : '/admin/categories/update/' + category.id}"
                      method="post">

                    <div class="mb-3">
                        <label for="code" class="form-label fw-semibold">
                            Mã danh mục <span class="text-danger">*</span>
                        </label>
                        <input id="code" type="text" th:field="*{code}"
                               class="form-control" maxlength="50"
                               placeholder="Ví dụ: FOOD, TOYS" required>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">
                            Tên danh mục <span class="text-danger">*</span>
                        </label>
                        <input id="name" type="text" th:field="*{name}"
                               class="form-control" maxlength="255"
                               placeholder="Nhập tên danh mục" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">
                            Mô tả
                        </label>
                        <textarea id="description" th:field="*{description}"
                                  class="form-control" rows="3"
                                  placeholder="Mô tả danh mục"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="parentCategory" class="form-label fw-semibold">
                            Danh mục cha
                        </label>
                        <select id="parentCategory" name="parentCategory.id"
                                class="form-select">
                            <option value="">-- Không có danh mục cha --</option>
                            <option th:each="parent : ${categories}"
                                    th:if="${category.id == null or parent.id != category.id}"
                                    th:value="${parent.id}"
                                    th:text="${parent.name}"
                                    th:selected="${category.parentCategory != null
                                        and category.parentCategory.id == parent.id}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="sortOrder" class="form-label fw-semibold">
                            Thứ tự hiển thị
                        </label>
                        <input id="sortOrder" type="number" th:field="*{sortOrder}"
                               class="form-control" min="0" value="0">
                    </div>

                    <div class="mb-4 form-check">
                        <input id="isActive" type="checkbox" th:field="*{isActive}"
                               class="form-check-input">
                        <label for="isActive" class="form-check-label">
                            Đang hoạt động
                        </label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success px-4">
                            <i class="bi bi-save me-1"></i>
                            <span th:text="${category.id == null ? 'Thêm danh mục' : 'Lưu thay đổi'}">
                                Lưu
                            </span>
                        </button>

                        <a th:href="@{/admin/categories}"
                           class="btn btn-outline-secondary px-4">
                            Quay lại
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
