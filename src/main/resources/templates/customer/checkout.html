<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Thanh Toán Đơn Hàng</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <h3 class="fw-bold mb-4">Thanh Toán</h3>
        
        <form th:action="@{/checkout/place-order}" th:object="${checkoutForm}" method="post">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h5 class="fw-bold mb-3">Thông Tin Giao Hàng</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small">Họ và tên người nhận</label>
                                <input type="text" class="form-control" th:field="*{recipientName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Số điện thoại</label>
                                <input type="text" class="form-control" th:field="*{recipientPhone}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">Tỉnh / Thành phố</label>
                                <input type="text" class="form-control" th:field="*{shippingProvince}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">Quận / Huyện</label>
                                <input type="text" class="form-control" th:field="*{shippingDistrict}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">Phường / Xã</label>
                                <input type="text" class="form-control" th:field="*{shippingWard}" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Địa chỉ chi tiết</label>
                                <input type="text" class="form-control" th:field="*{shippingAddressLine}" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Ghi chú cho shipper</label>
                                <textarea class="form-control" th:field="*{customerNote}" rows="2"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-bold mb-3">Phương Thức Thanh Toán</h5>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="COD" id="payCOD" checked>
                            <label class="form-check-label" for="payCOD">
                                <strong>COD</strong> — Thanh toán tiền mặt khi nhận hàng
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="VNPAY" id="payVNPAY" disabled>
                            <label class="form-check-label" for="payVNPAY">
                                <strong>VNPay</strong> — Sắp hỗ trợ thanh toán trực tuyến
                            </label>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-bold mb-3">Tóm Tắt Đơn Hàng</h5>
                        <ul class="list-group list-group-flush mb-3">
                            <li th:each="item : ${cart.items}" th:if="${item.isSelected}" class="list-group-item d-flex justify-content-between px-0">
                                <div>
                                    <h6 class="my-0" th:text="${item.productName + ' (' + item.variantName + ')'}">Sản phẩm</h6>
                                    <small class="text-muted" th:text="${'SL: ' + item.quantity + ' x ' + #numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT') + ' đ'}"></small>
                                </div>
                                <span class="text-muted" th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT') + ' đ'}"></span>
                            </li>
                        </ul>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Mã giảm giá (Voucher):</label>
                            <div class="input-group">
                                <input type="text" id="voucherCodeInput" class="form-control text-uppercase font-monospace"
                                       th:field="*{voucherCode}" placeholder="VD: PETWELCOME10">
                                <button type="button" id="btnApplyVoucher" class="btn btn-outline-primary fw-semibold">
                                    Áp Dụng
                                </button>
                            </div>
                            <div id="voucherFeedback" class="small mt-1"></div>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Tạm tính:</span>
                            <span th:text="${#numbers.formatDecimal(cart.subtotal, 0, 'COMMA', 0, 'POINT') + ' đ'}"></span>
                        </div>
                        <div id="voucherDiscountRow" class="d-flex justify-content-between mb-2 text-success fw-semibold" style="display: none !important;">
                            <span>Giảm giá voucher:</span>
                            <span id="voucherDiscountText">-0 đ</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2 text-muted">
                            <span>Phí ship:</span>
                            <span th:text="${#numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT') + ' đ'}"></span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <strong>Tổng cộng:</strong>
                            <strong id="finalTotalText" class="text-danger fs-5" th:text="${#numbers.formatDecimal(cart.subtotal + shippingFee, 0, 'COMMA', 0, 'POINT') + ' đ'}"></strong>
                        </div>
                        <button type="submit" class="btn btn-pet-primary w-100 py-3 fw-bold">Xác Nhận Đặt Hàng</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<th:block layout:fragment="custom-js">
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const btnApply = document.getElementById('btnApplyVoucher');
        const inputCode = document.getElementById('voucherCodeInput');
        const feedback = document.getElementById('voucherFeedback');
        const discountRow = document.getElementById('voucherDiscountRow');
        const discountText = document.getElementById('voucherDiscountText');
        const finalTotalText = document.getElementById('finalTotalText');
        const baseSubtotal = /*[[${cart.subtotal}]]*/ 0;
        const shippingFee = /*[[${shippingFee}]]*/ 0;

        btnApply.addEventListener('click', function() {
            const code = inputCode.value.trim();
            if (!code) {
                feedback.className = 'small text-danger mt-1';
                feedback.textContent = 'Vui lòng nhập mã giảm giá trước khi áp dụng.';
                return;
            }

            btnApply.disabled = true;
            btnApply.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Đang kiểm tra...';

            const formData = new FormData();
            formData.append('code', code);

            // Get CSRF token if present
            const csrfToken = document.querySelector('input[name="_csrf"]')?.value;
            if (csrfToken) {
                formData.append('_csrf', csrfToken);
            }

            fetch('/checkout/apply-voucher', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                btnApply.disabled = false;
                btnApply.textContent = 'Áp Dụng';

                if (data.valid) {
                    feedback.className = 'small text-success mt-1 fw-semibold';
                    feedback.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>' + data.message;

                    // Show discount
                    discountRow.style.removeProperty('display');
                    discountText.textContent = '-' + new Intl.NumberFormat('vi-VN').format(data.discountAmount) + ' đ';

                    // Update total
                    const newTotal = Number(data.finalTotal) + shippingFee;
                    finalTotalText.textContent = new Intl.NumberFormat('vi-VN').format(newTotal) + ' đ';
                } else {
                    feedback.className = 'small text-danger mt-1';
                    feedback.innerHTML = '<i class="bi bi-exclamation-circle-fill me-1"></i>' + data.message;

                    discountRow.style.setProperty('display', 'none', 'important');
                    const origTotal = Number(baseSubtotal) + shippingFee;
                    finalTotalText.textContent = new Intl.NumberFormat('vi-VN').format(origTotal) + ' đ';
                }
            })
            .catch(err => {
                btnApply.disabled = false;
                btnApply.textContent = 'Áp Dụng';
                feedback.className = 'small text-danger mt-1';
                feedback.textContent = 'Lỗi kết nối máy chủ khi kiểm tra voucher.';
            });
        });
    });
</script>
</th:block>
</body>
</html>
