<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main-layout}">
<head><title>Đổi mật khẩu</title></head>
<body><main layout:fragment="content" class="container py-5">
    <h1>Đổi mật khẩu</h1>
    <p>Hãy đổi mật khẩu tạm trước khi tiếp tục sử dụng tài khoản.</p>
    <div th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-danger"></div>
    <form th:action="@{/account/password}" th:object="${passwordForm}" method="post" class="col-md-6">
        <div th:if="${#fields.hasErrors('*')}" th:each="err : ${#fields.errors('*')}" th:text="${err}" class="text-danger"></div>
        <label class="form-label">Mật khẩu hiện tại</label><input class="form-control mb-3" type="password" th:field="*{currentPassword}" required autocomplete="current-password">
        <label class="form-label">Mật khẩu mới</label><input class="form-control mb-3" type="password" th:field="*{newPassword}" required minlength="6" autocomplete="new-password">
        <label class="form-label">Xác nhận mật khẩu mới</label><input class="form-control mb-3" type="password" th:field="*{confirmNewPassword}" required autocomplete="new-password">
        <button type="submit" class="btn btn-primary">Lưu và đăng nhập lại</button>
    </form>
</main></body></html>
