<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Đơn Hàng Của Tôi</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <h3 class="fw-bold mb-4">Lịch Sử Đơn Hàng</h3>
        
        <div th:if="${orders != null and !orders.empty}">
            <div th:each="order : ${orders.content}" class="card border-0 shadow-sm rounded-4 p-4 mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-bold fs-6" th:text="${order.orderCode}">ORD-XXXX</span>
                    <span class="badge bg-primary" th:text="${order.orderStatus}">CONFIRMED</span>
                </div>
                <div class="text-muted small mb-2" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</div>
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span>Tổng tiền: </span>
                        <strong class="text-danger" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ'}">100.000 đ</strong>
                        <span class="badge bg-secondary ms-2" th:text="${order.paymentMethod}">COD</span>
                    </div>
                    <a th:href="@{/customer/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">Chi Tiết</a>
                </div>
            </div>
        </div>

        <div th:if="${orders == null or orders.empty}" class="text-center py-5">
            <i class="bi bi-box-seam display-1 text-muted"></i>
            <h5 class="mt-3 text-muted">Bạn chưa có đơn hàng nào</h5>
        </div>
    </div>
</div>
</body>
</html>
