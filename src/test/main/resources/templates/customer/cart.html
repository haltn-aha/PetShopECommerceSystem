<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title>Giỏ Hàng Của Bạn</title>
</head>
<body>
<div layout:fragment="content" class="py-5">
    <div class="container">
        <h3 class="fw-bold mb-4">Giỏ Hàng</h3>
        
        <div th:if="${cart != null and !cart.items.empty}" class="row g-4">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-3">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Sản phẩm</th>
                                    <th>Đơn giá</th>
                                    <th>Số lượng</th>
                                    <th>Thành tiền</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${cart.items}">
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <img th:src="${item.imageUrl != null ? item.imageUrl : 'https://placehold.co/80x80?text=Pet'}" width="60" height="60" class="rounded" alt="Item">
                                            <div>
                                                <h6 class="fw-bold mb-0" th:text="${item.productName}">Tên sản phẩm</h6>
                                                <small class="text-muted" th:text="${item.variantName}">Phân loại</small>
                                            </div>
                                        </div>
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT') + ' đ'}">100.000 đ</td>
                                    <td>
                                        <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center gap-2">
                                            <input type="hidden" name="itemId" th:value="${item.id}">
                                            <input type="number" name="quantity" class="form-control form-control-sm" th:value="${item.quantity}" min="1" th:max="${item.maxStock}" style="width: 70px;">
                                            <button type="submit" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-repeat"></i></button>
                                        </form>
                                    </td>
                                    <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT') + ' đ'}">200.000 đ</td>
                                    <td>
                                        <form th:action="@{/cart/remove}" method="post">
                                            <input type="hidden" name="itemId" th:value="${item.id}">
                                            <button type="submit" class="btn btn-sm text-danger"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h5 class="fw-bold mb-3">Tóm Tắt Đơn Hàng</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Tạm tính:</span>
                        <span class="fw-bold" th:text="${#numbers.formatDecimal(cart.subtotal, 0, 'COMMA', 0, 'POINT') + ' đ'}">0 đ</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 text-muted">
                        <span>Phí vận chuyển:</span>
                        <span>30.000 đ</span>
                    </div>
                    <hr>
                    <a th:href="@{/checkout}" class="btn btn-pet-primary w-100 py-2 fw-semibold">Tiến Hành Đặt Hàng</a>
                </div>
            </div>
        </div>

        <div th:if="${cart == null or cart.items.empty}" class="text-center py-5">
            <i class="bi bi-cart-x display-1 text-muted"></i>
            <h4 class="mt-3">Giỏ hàng của bạn đang trống</h4>
            <a th:href="@{/products}" class="btn btn-pet-primary mt-3">Tiếp Tục Mua Sắm</a>
        </div>
    </div>
</div>
</body>
</html>
