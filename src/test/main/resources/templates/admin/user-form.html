<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}">
<head>
    <title>Cấp Tài Khoản Nhân Viên</title>
</head>
<body>
<div layout:fragment="admin-header-title">
    <span>Quản Trị Hệ Thống / Cấp Tài Khoản Nhân Viên</span>
</div>

<div layout:fragment="admin-content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h4 class="fw-bold mb-1">Cấp Tài Khoản Nhân Viên Mới</h4>
                    <p class="text-muted small mb-0">Tạo tài khoản với vai trò STAFF để phân quyền vận hành cửa hàng.</p>
                </div>
                <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <form th:action="@{/admin/users/create}" th:object="${staffForm}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và Tên Nhân Viên <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{fullName}" class="form-control form-control-lg"
                               placeholder="VD: Nguyễn Văn B" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   placeholder="staff@petshop.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Số Điện Thoại <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{phone}" class="form-control"
                                   placeholder="0912345678" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mật khẩu ban đầu <span class="text-danger">*</span></label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   placeholder="Tối thiểu 6 ký tự" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control"
                                   placeholder="Nhập lại mật khẩu" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        </div>
                    </div>

                    <div class="alert alert-info py-2 px-3 small border-0 bg-info-subtle text-info-emphasis mb-4">
                        <i class="bi bi-info-circle-fill me-1"></i> Tài khoản sau khi tạo sẽ tự động được gán quyền <strong>STAFF</strong> và kích hoạt trạng thái <strong>ACTIVE</strong>.
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/admin/users}" class="btn btn-light px-4">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-check2-circle me-1"></i> Cấp Tài Khoản
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
