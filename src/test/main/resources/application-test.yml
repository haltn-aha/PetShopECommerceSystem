# =====================================================================
# PETSHOP SWP391 — TEST PROFILE (H2 IN-MEMORY DATABASE)
# =====================================================================
spring:
  datasource:
    url: jdbc:h2:mem:petshoptest;DB_CLOSE_DELAY=-1;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  thymeleaf:
    cache: false
logging:
  level:
    root: WARN
    com.petshop: INFO
